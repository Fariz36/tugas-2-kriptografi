[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jav128"
version = "0.1.0"
description = "Experimental 128-bit block cipher project"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
sbox-search = ["numpy>=1.24"]

[project.scripts]
jav128 = "jav128.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
